# BUILD APP LẮNG TỰ ĐỘNG (GitHub Actions)
#   • Android: APK đã ký, tách theo loại chip (arm64 cho máy đời mới, armeabi-v7a cho máy rất cũ) → mỗi file nhẹ hơn
#   • iOS:     IPA chưa ký (cài bằng Sideloadly / AltStore với Apple ID miễn phí) — và IPA đã ký sẵn nếu có tài khoản
#              Apple Developer (đặt secrets, xem cuối tệp)
# Chạy khi: push lên main, mở pull request, đẩy tag "v*" (tạo bản phát hành kèm file cài), hoặc bấm "Run workflow".
# Tải file cài: tab Actions → lần chạy → mục Artifacts; hoặc tab Releases nếu đẩy tag (vd: git tag v0.2.0 && git push --tags).
name: Build app (APK + iOS)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - '.github/workflows/build-apps.yml'
  pull_request:
    paths: ['app/**']
  workflow_dispatch:

permissions:
  contents: write # để đính file cài vào bản phát hành (Releases) khi đẩy tag

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

env:
  FLUTTER_CHANNEL: stable
  # số bản build tăng dần theo lần chạy → điện thoại nhận là bản mới, cài đè được
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  test:
    name: Kiểm tra (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/**/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get

      # Khoá ký app (tuỳ chọn, NÊN có): cùng một khoá thì bản mới cài đè lên bản cũ được.
      # Không có secrets → ký bằng khoá debug của máy build (mỗi lần build khác khoá → phải gỡ app cũ trước khi cài).
      - name: Giải khoá ký Android từ secrets
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build APK (tách theo chip)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-arm \
            --build-number "$BUILD_NUMBER"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/Lang-${BUILD_NUMBER}-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/Lang-${BUILD_NUMBER}-armv7-may-cu.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: Lang-android
          path: app/dist/*.apk
          retention-days: 30

      - name: Đính kèm vào bản phát hành (khi đẩy tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist/*.apk

  ios:
    name: iOS IPA
    runs-on: macos-15
    timeout-minutes: 75
    env:
      HAS_IOS_SIGNING: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get

      # 1) IPA CHƯA KÝ — luôn có. Cài lên iPhone: Sideloadly (Windows/Mac) hoặc AltStore, đăng nhập Apple ID thường;
      #    công cụ đó tự ký lại bằng Apple ID của bạn (miễn phí: dùng 7 ngày rồi cài lại, tối đa 3 app).
      - name: Build iOS (chưa ký)
        run: |
          flutter build ios --release --no-codesign --build-number "$BUILD_NUMBER"
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (cd dist && zip -qry "Lang-${BUILD_NUMBER}-chua-ky.ipa" Payload && rm -rf Payload)
          ls -lh dist

      # 2) IPA ĐÃ KÝ (tuỳ chọn) — cần tài khoản Apple Developer (99 USD/năm). Đặt các secrets ở cuối tệp này.
      - name: Ký IPA (nếu có chứng chỉ Apple)
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          P12_B64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'ad-hoc' }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/ky.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          echo "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/app.mobileprovision"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision")")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision")")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>${EXPORT_METHOD}</string>
          <key>teamID</key><string>${TEAM_ID}</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict><key>vn.earthsense.danbauTraiDat</key><string>${PROFILE_NAME}</string></dict>
          </dict></plist>
          EOF
          flutter build ios --release --config-only --build-number "$BUILD_NUMBER"
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" -destination 'generic/platform=iOS' archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CODE_SIGN_IDENTITY="Apple Distribution" | tail -n 30
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/ipa" | tail -n 20
          cp "$RUNNER_TEMP"/ipa/*.ipa "../dist/Lang-${BUILD_NUMBER}-da-ky.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Lang-ios
          path: app/dist/*.ipa
          retention-days: 30

      - name: Đính kèm vào bản phát hành (khi đẩy tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist/*.ipa

# ---------------------------------------------------------------------------------------------------------------
# SECRETS (Settings → Secrets and variables → Actions → New repository secret). KHÔNG đưa khoá vào mã nguồn.
#  Android (nên có):
#    ANDROID_KEYSTORE_BASE64   khoá .jks mã hoá base64. Tạo một lần trên máy:
#        keytool -genkey -v -keystore earthsense.jks -keyalg RSA -keysize 2048 -validity 10000 -alias earthsense
#        rồi (PowerShell) [Convert]::ToBase64String([IO.File]::ReadAllBytes("earthsense.jks")) | Set-Clipboard
#    ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (vd earthsense), ANDROID_KEY_PASSWORD
#  iOS đã ký (tuỳ chọn, cần Apple Developer):
#    IOS_P12_BASE64 + IOS_P12_PASSWORD   chứng chỉ "Apple Distribution" xuất ra .p12, mã hoá base64
#    IOS_PROFILE_BASE64                  provisioning profile (Ad Hoc: cài cho các iPhone đã đăng ký UDID)
#    IOS_TEAM_ID                         mã Team 10 ký tự
#    (biến IOS_EXPORT_METHOD = app-store để đưa lên TestFlight thay cho ad-hoc)
