# Build IPA iPhone cho Lắng (thư mục app/) bằng GitHub Actions — máy macOS của GitHub có sẵn Xcode.
#
# Khi nào chạy (giống APK):
#   - push lên main/master/dev/test có thay đổi trong app/  → build IPA, tải ở mục Artifacts của lượt chạy
#   - pull request vào main/master/dev/test                  → build kiểm tra
#   - đẩy tag dạng v1.2.3                            → build + gắn IPA vào GitHub Release (cùng release với APK)
#   - bấm "Run workflow" (tab Actions)               → build tay, có tuỳ chọn nhúng khoá / đẩy lên TestFlight
#
# Luôn có: IPA CHƯA KÝ (Lang-x.y.z-unsigned.ipa). iPhone không cài thẳng được file này; dùng Sideloadly hoặc
# AltStore + Apple ID để tự ký và cài (hết hạn sau 7 ngày với Apple ID miễn phí).
#
# Có thêm khi cài Secrets của tài khoản Apple Developer (99 USD/năm):
#   IOS_P12_BASE64            chứng chỉ "Apple Distribution" xuất ra .p12, mã hoá base64
#   IOS_P12_PASSWORD          mật khẩu file .p12
#   IOS_PROFILE_BASE64        file .mobileprovision (Ad Hoc hoặc App Store) của bundle id, mã hoá base64
#   IOS_TEAM_ID               Team ID (10 ký tự) trong developer.apple.com → Membership
#   → IPA ĐÃ KÝ (Lang-x.y.z.ipa). Profile Ad Hoc: cài được trên các iPhone đã đăng ký UDID.
# Đẩy lên TestFlight (cần profile App Store + 3 secrets khoá App Store Connect API):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (file AuthKey_XXXX.p8 mã hoá base64)
#
# Biến (Settings → Variables, không bắt buộc): APP_SERVER, IOS_BUNDLE_ID (mặc định vn.earthsense.danbauTraiDat)
# KHOÁ API: giống APK, mặc định IPA không mang khoá; trợ lý AI và APOD đi qua máy chủ Vercel của app.

name: iOS IPA

on:
  push:
    branches: [main, master, dev, test]
    tags: ['v*']
    paths:
      - 'app/**'
      - '.github/workflows/ios-ipa.yml'
  pull_request:
    branches: [main, master, dev, test]
    paths:
      - 'app/**'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:
    inputs:
      embed_keys:
        description: 'Nhúng khoá API từ GitHub Secrets vào IPA (CHỈ để thử nội bộ — khoá có thể bị trích ra)'
        type: boolean
        default: false
      testflight:
        description: 'Đẩy IPA đã ký lên TestFlight (cần profile App Store + secrets ASC_*)'
        type: boolean
        default: false

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # để gắn IPA vào GitHub Release khi đẩy tag v*

env:
  FLUTTER_CHANNEL: stable
  # Ghim đúng bản Flutter mà máy của đội đang dùng (flutter --version) để CI build giống hệt máy.
  # Bản stable mới nhất có thể đòi Gradle/AGP mới hơn dự án → lỗi build. Nâng cấp Flutter thì sửa số này.
  FLUTTER_VERSION: '3.44.8'
  APP_SERVER: ${{ vars.APP_SERVER || 'https://sense-app-two.vercel.app' }}
  BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'vn.earthsense.danbauTraiDat' }}

jobs:
  build-ipa:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      HAS_SIGNING: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: |
          flutter --version
          xcodebuild -version

      - run: flutter pub get

      - name: Đặt số phiên bản
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Phiên bản: $NAME (build ${GITHUB_RUN_NUMBER})"

      # Dự án chưa có ios/Podfile (chưa từng build trên Mac): để Flutter tạo, rồi đặt iOS tối thiểu 13.0 cho khớp Xcode project
      - name: Chuẩn bị CocoaPods
        run: |
          if [ ! -f ios/Podfile ]; then
            flutter build ios --config-only --release --no-codesign
          fi
          sed -i '' -E "s/^#? *platform :ios, '[0-9.]+'/platform :ios, '13.0'/" ios/Podfile
          grep -n "platform :ios" ios/Podfile || true
          # đổi bundle id nếu đội dùng id khác (phải trùng với App ID trên developer.apple.com)
          if [ "$BUNDLE_ID" != "vn.earthsense.danbauTraiDat" ]; then
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = vn.earthsense.danbauTraiDat;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/" ios/Runner.xcodeproj/project.pbxproj
          fi

      - name: Ghi keys.json từ Secrets (tuỳ chọn)
        if: github.event_name == 'workflow_dispatch' && inputs.embed_keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          GOOGLE_WEATHER_KEY: ${{ secrets.GOOGLE_WEATHER_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          names = ["GEMINI_API_KEY", "NASA_API_KEY", "GOOGLE_WEATHER_KEY", "FIRMS_MAP_KEY", "NVIDIA_API_KEY", "GROQ_API_KEY"]
          keys = {n: os.environ[n] for n in names if os.environ.get(n)}
          json.dump(keys, open("keys.json", "w"))
          print("Nhúng các khoá:", ", ".join(keys) or "(không có secret nào)")
          PY
          echo "::warning::IPA này có nhúng khoá API. Chỉ dùng thử nội bộ, KHÔNG chia sẻ công khai."

      - name: Tham số build chung
        id: args
        run: |
          A="--release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.number }} --dart-define=APP_SERVER=$APP_SERVER"
          if [ -f keys.json ]; then A="$A --dart-define-from-file=keys.json"; fi
          echo "args=$A" >> "$GITHUB_OUTPUT"
          SUFFIX=""; if [ -f keys.json ]; then SUFFIX="-co-khoa-noi-bo"; fi
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"

      # ---------- 1) IPA CHƯA KÝ: luôn build (cũng là bước kiểm tra bản iOS biên dịch được) ----------
      - name: flutter build ios (không ký)
        run: flutter build ios --no-codesign ${{ steps.args.outputs.args }}

      - name: Đóng gói IPA chưa ký
        run: |
          mkdir -p ../dist /tmp/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app /tmp/ipa/Payload/
          (cd /tmp/ipa && zip -qry "$GITHUB_WORKSPACE/dist/Lang-${{ steps.ver.outputs.name }}-unsigned${{ steps.args.outputs.suffix }}.ipa" Payload)
          ls -lh ../dist

      # ---------- 2) IPA ĐÃ KÝ: chỉ khi có Secrets của tài khoản Apple Developer ----------
      - name: Cài chứng chỉ và provisioning profile
        if: env.HAS_SIGNING == 'true'
        id: sign
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          KC="$RUNNER_TEMP/lang-signing.keychain-db"
          KCPASS="$(uuidgen)"
          echo "$P12_BASE64" | base64 -D > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # đọc tên, UUID, loại của profile
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PNAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          if /usr/libexec/PlistBuddy -c 'Print ProvisionedDevices' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            METHOD=release-testing   # Ad Hoc (Xcode 15.4+; tên cũ: ad-hoc)
          else
            METHOD=app-store-connect # App Store / TestFlight (tên cũ: app-store)
          fi
          echo "Profile: $PNAME ($UUID), cách xuất: $METHOD"
          # Ký thủ công chỉ cho target Runner (các thư viện CocoaPods không cần ký riêng)
          perl -0pi -e "s/(PRODUCT_BUNDLE_IDENTIFIER = \Q$BUNDLE_ID\E;)/\$1\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = $TEAM_ID;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$PNAME\";\n\t\t\t\t\"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\";/g" ios/Runner.xcodeproj/project.pbxproj
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PNAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          echo "method=$METHOD" >> "$GITHUB_OUTPUT"

      - name: flutter build ipa (đã ký)
        if: env.HAS_SIGNING == 'true'
        run: |
          flutter build ipa ${{ steps.args.outputs.args }} --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          cp build/ios/ipa/*.ipa "../dist/Lang-${{ steps.ver.outputs.name }}${{ steps.args.outputs.suffix }}.ipa"
          ls -lh ../dist

      - name: Đẩy lên TestFlight
        if: env.HAS_SIGNING == 'true' && github.event_name == 'workflow_dispatch' && inputs.testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ "${{ steps.sign.outputs.method }}" != "app-store-connect" ]; then
            echo "::error::TestFlight cần provisioning profile loại App Store (đang dùng Ad Hoc)."; exit 1
          fi
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "::error::Thiếu secrets ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64."; exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -t ios -f build/ios/ipa/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Dọn khoá khỏi máy CI
        if: always()
        run: |
          rm -f keys.json "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision" "$HOME/.appstoreconnect/private_keys/"*.p8
          security delete-keychain "$RUNNER_TEMP/lang-signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: Lang-ipa-${{ steps.ver.outputs.name }}-build${{ steps.ver.outputs.number }}${{ steps.args.outputs.suffix }}
          path: dist/*.ipa
          retention-days: 30

      - name: Gắn IPA vào GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipa
